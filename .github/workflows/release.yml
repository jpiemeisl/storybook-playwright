# Publishes @jpiemeisl/pattern-library to GitHub Packages (private) and creates the GitHub Release.
# Runs on a pushed version tag (npm run release:tag pushes it), or by hand as a dry run:
#   gh workflow run release.yml -f dry_run=true
# Every release is a commit on main that passed ci-status, tagged v<package.json version>. See
# docs/publishing.md. This is the only place `npm publish` may run (package.json's prepublishOnly refuses
# anywhere RELEASE_WORKFLOW=1 is not set).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build, check and npm publish --dry-run; nothing is published or released)
        type: boolean
        default: true

# One release at a time, and a release in progress is never cancelled (a half-finished publish is worse
# than a queued one).
concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default; the release job asks for exactly what it needs.
permissions: {}

env:
  npm_config_update_notifier: 'false'
  npm_config_fund: 'false'
  npm_config_audit: 'false'

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload its asset
      packages: write # publish to GitHub Packages
      checks: read # verify ci-status for the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the on-main check needs origin/main and the tag's ancestry.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@jpiemeisl'

      - name: Decide the mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if [ "$EVENT" = "push" ]; then
            dry_run=false
          elif [ "$DRY_RUN_INPUT" = "false" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::A real publish runs only for a version tag. Run npm run release:tag, or dispatch with dry_run=true."
              exit 1
            fi
            dry_run=false
          else
            dry_run=true
          fi
          {
            echo "dry_run=$dry_run"
            echo "version=$version"
            echo "name=$name"
            echo "tag=v$version"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $name@$version from $REF_TYPE $REF_NAME ($(git rev-parse --short HEAD)); dry run: $dry_run"

      - name: Verify the tag matches package.json
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$TAG" ]; then
              echo "::error::Tag $REF_NAME does not match package.json (expected $TAG). Delete the stray tag; never move a published one."
              exit 1
            fi
            echo "Tag $REF_NAME matches package.json."
          else
            echo "Dry run from branch $REF_NAME: no tag to check. A release of this commit would be tagged $TAG."
            if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
              echo "::warning::$TAG already exists, so this version is already released. Prepare the next version before tagging."
            fi
          fi

      - name: Verify the commit is on main
        env:
          SHA: ${{ steps.mode.outputs.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main. Releases are cut only from commits merged into main."
            exit 1
          fi
          echo "$SHA is on main."

      - name: Verify ci-status passed for the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.mode.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=ci-status&per_page=100" > "$RUNNER_TEMP/check-runs.json"
          node scripts/release.mjs ci-status "$RUNNER_TEMP/check-runs.json"

      - run: npm ci
      - run: npm run build:lib
      - run: npm run check:lib
      # Writes the packed file list to the job summary.
      - run: npm run check:package
      - run: npm run check:api
      - run: npm run test:unit

      - name: Publish to GitHub Packages
        env:
          RELEASE_WORKFLOW: '1'
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: npm publish --dry-run lists what would be published; nothing is sent."
            npm publish --dry-run
          else
            npm publish
          fi

      # Installs the version just published from GitHub Packages into a fresh app and builds it. Retries
      # briefly: a new version can take a few seconds to become installable.
      - name: Smoke test the published package
        if: steps.mode.outputs.dry_run == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC: ${{ steps.mode.outputs.name }}@${{ steps.mode.outputs.version }}
        run: |
          for attempt in 1 2 3 4; do
            rm -rf "$RUNNER_TEMP/smoke-app"
            if node scripts/smoke-app.mjs "$SPEC" "$RUNNER_TEMP/smoke-app" --registry; then exit 0; fi
            echo "Attempt $attempt failed; retrying in 20 s."
            sleep 20
          done
          echo "::error::$SPEC could not be installed and built from GitHub Packages."
          exit 1

      - name: Build the Storybook for the release asset
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          npm run build-storybook
          (cd storybook-static && zip -qr "$RUNNER_TEMP/storybook-$TAG.zip" .)
          ls -l "$RUNNER_TEMP/storybook-$TAG.zip"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.mode.outputs.version }}
        run: node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub Release
        if: steps.mode.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.mode.outputs.tag }}
        run: gh release create "$TAG" "$RUNNER_TEMP/storybook-$TAG.zip#Storybook $TAG (static build, open index.html)" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Job summary
        if: always()
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          NAME: ${{ steps.mode.outputs.name }}
          VERSION: ${{ steps.mode.outputs.version }}
          TAG: ${{ steps.mode.outputs.tag }}
          SHA: ${{ steps.mode.outputs.sha }}
          STATUS: ${{ job.status }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then echo "## Release dry run: $NAME@$VERSION ($STATUS)"; else echo "## Release: $NAME@$VERSION ($STATUS)"; fi
            echo
            echo "- Commit: \`$SHA\`"
            echo "- Tag: \`$TAG\`"
            if [ "$DRY_RUN" = "true" ]; then
              echo "- Nothing was published and no GitHub Release was created. The publish step's log lists the files npm would publish; the package contents section below lists them too."
            else
              echo "- Package: $REPO_URL/pkgs/npm/${NAME#*/}"
              echo "- Release: $REPO_URL/releases/tag/$TAG"
            fi
            if [ -s "$RUNNER_TEMP/notes.md" ]; then
              echo
              echo "### Release notes"
              echo
              cat "$RUNNER_TEMP/notes.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
