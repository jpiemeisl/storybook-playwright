<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font resolution for the visual-test container (passed in as FONTCONFIG_FILE by scripts/docker-run.mjs).

  Without it, fontconfig in the Playwright image maps `system-ui` (first in the library's sans stack) to
  WenQuanYi Zen Hei, a CJK font with no bold face: every heading and button rendered as regular text.
  Here every family in the token stacks resolves to the Liberation fonts installed in the image, which
  have real regular, bold and italic faces and are metric-compatible with Arial, Times New Roman and
  Courier New. Rendering is the same on every machine; it is Arial-like rather than Segoe UI.
  Only the container uses this file; browsers on host machines are unaffected.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>

  <!-- Sans: the font-sans token (system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif). -->
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <alias binding="strong"><family>-apple-system</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Roboto</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>

  <!-- Serif: the font-serif token and orchard's heading stack (ui-serif, Georgia, Cambria, Iowan Old Style, Palatino Linotype, Times New Roman, Times, serif). -->
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>ui-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <alias binding="strong"><family>Georgia</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Cambria</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Iowan Old Style</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Palatino Linotype</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Times</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>

  <!-- Mono: the font-mono token (ui-monospace, Cascadia Code, SF Mono, Menlo, Consolas, Liberation Mono, monospace). -->
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>ui-monospace</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Mono</string></edit>
  </match>
  <alias binding="strong"><family>Cascadia Code</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="strong"><family>SF Mono</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="strong"><family>Menlo</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="strong"><family>Consolas</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
